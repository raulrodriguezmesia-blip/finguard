spring.application.name=finguard
server.port=8080

# Datasource - credenciales desde AWS Secrets Manager (inyectadas por variables de entorno en ECS)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/finguard}
spring.datasource.username=${DATABASE_USERNAME:finguard}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.export.cloudwatch.enabled=true
management.cloudwatch.namespace=finguard

# Virtual Threads
spring.threads.virtual.enabled=true

# Kafka (opcional en prod)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=finguard-group

# AWS Region
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
