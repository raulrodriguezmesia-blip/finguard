spring.application.name=finguard
server.port=8080

# Datasource (example using PostgreSQL - will be overridden by environment variables in cloud)
spring.datasource.url=jdbc:postgresql://localhost:5432/finguard
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.export.cloudwatch.enabled=true
management.cloudwatch.namespace=finguard

# Virtual Threads
spring.threads.virtual.enabled=true

# Kafka (optional)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=finguard-group

# AWS Region
spring.cloud.aws.region.static=us-east-1
