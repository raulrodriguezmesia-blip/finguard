# Configuración de la aplicación AI-Powered Fintech & Cloud Observability Platform
# Placeholders for environment variables enable cloud-ready deployment

# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/observability}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.ai.fintech.observability=${LOG_LEVEL_APP:DEBUG}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_HIBERNATE_BINDER:OFF}

# OpenTelemetry Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.otlp.tracing.enabled=true
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
management.otlp.metrics.enabled=true
management.otlp.metrics.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
management.otlp.logging.enabled=true
management.otlp.logging.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

# Application Properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=ai-powered-fintech-observability-platform
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Actuator Configuration
management.endpoints.enabled-by-default=true
management.endpoint.shutdown.enabled=false
management.info.git.mode=full
management.info.env.enabled=true

# Jackson Configuration for better JSON handling
spring.jackson.serialization.write_dates_as_timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.property-naming-strategy=SNAKE_CASE

# Multipart Configuration (for file uploads if needed later)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Task Execution Configuration
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prf=task-
spring.task.execution.pool.allow-core-thread-timeout=true

# Cache Configuration (for future use)
spring.cache.type=none

# Thymeleaf Configuration (if using server-side rendering)
spring.thymeleaf.cache=false

# Resource Handling
spring.mvc.static-path-pattern=/resources/**
spring.web.resources.add-mappings=false