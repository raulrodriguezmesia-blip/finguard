name: CI/CD + Diagnostic FinGuard

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ACR_NAME: finguarddevacr
  IMAGE_NAME: finguard-app
  NAMESPACE: finguard-ns
  DEPLOYMENT: finguard-app
  SERVICE: finguard-app-service

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & Push to ACR
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image $IMAGE_NAME:${{ github.sha }} \
            --file Dockerfile . \
            --timeout 900

      - name: Verify image in ACR
        run: |
          az acr repository show-tags \
            --name $ACR_NAME \
            --repository $IMAGE_NAME \
            --output table

      - name: Set AKS context
        run: |
          az aks get-credentials \
            --resource-group rg-finguard-dev \
            --name aks-finguard-dev \
            --overwrite-existing

      - name: Update AKS Deployment
        run: |
          kubectl set image deployment/$DEPLOYMENT \
            $DEPLOYMENT=$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
            -n $NAMESPACE
          kubectl rollout restart deployment/$DEPLOYMENT -n $NAMESPACE
          kubectl rollout status deployment/$DEPLOYMENT -n $NAMESPACE --timeout=180s

      - name: Validate Pods
        run: kubectl get pods -n $NAMESPACE

      - name: Get Service EXTERNAL-IP
        run: kubectl get svc $SERVICE -n $NAMESPACE

  diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Trigger ACR Build (diagnostic mode)
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image $IMAGE_NAME:${{ github.sha }} \
            --file Dockerfile . \
            --timeout 900 \
            --no-logs \
            --no-wait

      - name: Wait and Fetch Build Runs
        run: |
          echo "⏳ Esperando builds recientes..."
          az acr task list-runs --registry $ACR_NAME --output table

      - name: Capture Logs in JSON
        run: |
          RUN_ID=$(az acr task list-runs --registry $ACR_NAME --query "[0].runId" -o tsv)
          echo "📄 Capturando logs del build $RUN_ID"
          az acr task logs --registry $ACR_NAME --run-id $RUN_ID --output json > acr_build_logs.json
          echo "✅ Logs guardados en acr_build_logs.json"