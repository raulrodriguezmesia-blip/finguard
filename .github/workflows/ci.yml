name: CI/CD - Fintech Platform

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Permite ejecución manual desde la UI de GitHub Actions

env:
  MAVEN_OPTS: "-Dfile.encoding=UTF-8 -Djava.awt.headless=true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven # Gestor nativo de caché para .m2

      - name: Validate pom.xml
        run: mvn validate -B

      - name: Run tests
        run: mvn verify -B -e

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 30

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: finguarddevacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t finguarddevacr.azurecr.io/finguard-app:${IMAGE_TAG} .
          docker tag finguarddevacr.azurecr.io/finguard-app:${IMAGE_TAG} finguarddevacr.azurecr.io/finguard-app:latest
          docker push finguarddevacr.azurecr.io/finguard-app:${IMAGE_TAG}
          docker push finguarddevacr.azurecr.io/finguard-app:latest

  deploy-aks:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set KUBECONFIG for AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-finguard-dev
          cluster-name: aks-finguard-dev

      - name: Deploy manifests to AKS
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|:1.0.0|:${IMAGE_TAG}|g" ./k8s/finguard-deployment.yaml
          kubectl apply -f ./k8s/finguard-configmap.yaml
          kubectl apply -f ./k8s/finguard-deployment.yaml
          kubectl apply -f ./k8s/finguard-secrets.yaml
          kubectl apply -f ./k8s/finguard-service.yaml
          kubectl apply -f ./k8s/finguard-hpa.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/finguard-app --timeout=120s

      - name: Show deployed pods
        run: kubectl get pods -l app=finguard-app
