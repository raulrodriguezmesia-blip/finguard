name: CI/CD - Fintech Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for tags and branches

      # Set up Java 21 (Temurin)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Cache Maven dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Validate pom.xml (fails fast on XML errors)
      - name: Validate pom.xml
        run: mvn validate -B

      # Run full test suite (unit + integration tests)
      - name: Run tests
        run: mvn verify -B

      # Upload test reports as artifacts
      - name: Upload test reports
        if: always()  # Always run to collect test results even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path:
            - "**/target/surefire-reports/"
            - "**/target/failsafe-reports/"
          retention-days: 7

      # Upload JAR file as artifact
      - name: Upload JAR artifact
        if: success()  # Only upload if build succeeds
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/observability-platform-1.0.0-SNAPSHOT.jar
          retention-days: 30

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Java 21 (needed for Maven build)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Log in to Azure Container Registry
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: finguarddevacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Set image tag for traceability
      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t finguarddevacr.azurecr.io/finguard-app:${IMAGE_TAG} .
          docker tag finguarddevacr.azurecr.io/finguard-app:${IMAGE_TAG} finguarddevacr.azurecr.io/finguard-app:latest

      # Push Docker image to ACR
      - name: Push Docker image
        run: docker push finguarddevacr.azurecr.io/finguard-app:${IMAGE_TAG}

      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      # Push Docker image with SHA for traceability
      - name: Push Docker image with SHA
        if: github.event_name == 'push'
        run: |
          docker push finguarddevacr.azurecr.io/finguard-app:${IMAGE_TAG}

  deploy-aks:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set KUBECONFIG for AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-finguard-dev
          cluster-name: aks-finguard-dev
          admin-client-id: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy manifests to AKS
        run: |
          # Update deployment with correct ACR image tag
          sed -i "s|:1.0.0|:${IMAGE_TAG}|g" ./k8s/finguard-deployment.yaml
          kubectl apply -f ./k8s/finguard-configmap.yaml
          kubectl apply -f ./k8s/finguard-deployment.yaml
          kubectl apply -f ./k8s/finguard-secrets.yaml
          kubectl apply -f ./k8s/finguard-service.yaml
          kubectl apply -f ./k8s/finguard-hpa.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/finguard-app --timeout=120s

      - name: Show deployed pods
        run: kubectl get pods -l app=finguard-app