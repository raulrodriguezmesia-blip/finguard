name: CI/CD - Fintech Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Validate pom.xml
        run: mvn validate -B

      - name: Run tests
        run: mvn verify -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 30

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Login to Azure Container Registry
      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: finguarddevacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Build and push Docker image con SHA y latest
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t finguarddevacr.azurecr.io/finguard-app:${IMAGE_TAG} .
          docker push finguarddevacr.azurecr.io/finguard-app:${IMAGE_TAG}
          docker tag finguarddevacr.azurecr.io/finguard-app:${IMAGE_TAG} finguarddevacr.azurecr.io/finguard-app:latest
          docker push finguarddevacr.azurecr.io/finguard-app:latest
          docker tag finguarddevacr.azurecr.io/finguard-app:${IMAGE_TAG} finguarddevacr.azurecr.io/finguard-app:1.0.0
          docker push finguarddevacr.azurecr.io/finguard-app:1.0.0

  deploy-aks:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set KUBECONFIG for AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-finguard-dev
          cluster-name: aks-finguard-dev
          credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy manifests to AKS
        run: |
          kubectl apply -f ./k8s/finguard-configmap.yaml
          kubectl apply -f ./k8s/finguard-deployment.yaml
          kubectl apply -f ./k8s/finguard-secrets.yaml
          kubectl apply -f ./k8s/finguard-service.yaml
          kubectl apply -f ./k8s/finguard-hpa.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/finguard-app --timeout=120s

      - name: Show deployed pods
        run: kubectl get pods -l app=finguard-app
