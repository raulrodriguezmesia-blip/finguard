name: CI/CD - Fintech Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for tags and branches

      # Set up Java 21 (Temurin)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Cache Maven dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Validate pom.xml (fails fast on XML errors)
      - name: Validate pom.xml
        run: mvn validate -B

      # Run full test suite (unit + integration tests)
      - name: Run tests
        run: mvn verify -B

      # Upload test reports as artifacts
      - name: Upload test reports
        if: always()  # Always run to collect test results even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: 
            - **/target/surefire-reports/
            - **/target/failsafe-reports/
          retention-days: 7

      # Upload JAR file as artifact
      - name: Upload JAR artifact
        if: success()  # Only upload if build succeeds
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 30

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Java 21 (needed for Maven build)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t fintech-platform:latest .
          docker tag fintech-platform:latest ${{ secrets.DOCKERHUB_USERNAME }}/fintech-platform:latest

      # Push Docker image to Docker Hub
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/fintech-platform:latest

      # Optional: Also push with git SHA for traceability
      - name: Push Docker image with SHA
        if: github.event_name == 'push'
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker tag fintech-platform:latest ${{ secrets.DOCKERHUB_USERNAME }}/fintech-platform:$IMAGE_TAG
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fintech-platform:$IMAGE_TAG