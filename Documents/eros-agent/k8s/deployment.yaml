apiVersion: apps/v1
kind: Deployment
metadata:
  name: finguard-deployment
  namespace: finguard
  labels:
    app: finguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finguard
  template:
    metadata:
      labels:
        app: finguard
    spec:
      containers:
      - name: finguard
        image: acrfinguard2026.azurecr.io/eros-agent:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: DATABASE_URL
          value: "jdbc:postgresql://postgresql:5432/finguard"
        - name: DATABASE_USER
          value: "postgres"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: finguard-service
  namespace: finguard
spec:
  type: LoadBalancer
  selector:
    app: finguard
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finguard-hpa
  namespace: finguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finguard-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
