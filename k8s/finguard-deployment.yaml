apiVersion: apps/v1
kind: Deployment
metadata:
  name: finguard-app
  namespace: default
  labels:
    app: finguard-app
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finguard-app
  template:
    metadata:
      labels:
        app: finguard-app
        version: v1.0.0
    spec:
      imagePullSecrets:
      - name: finguard-acr-secret
      containers:
      - name: finguard-app
        image: finguarddevacr.azurecr.io/finguard-app:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: finguard-config
        - secretRef:
            name: finguard-secrets
        env:
        # Spring Datasource
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: finguard-secrets
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: finguard-secrets
              key: DB_PASSWORD
        # JWT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: finguard-secrets
              key: JWT_SECRET
        # OpenTelemetry
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: finguard-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: finguard-config
              key: OTEL_SERVICE_NAME
        
        # Resource Limits
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        
        # Liveness Probe
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        # Readiness Probe
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
